name: Resume PDF

on:
  push:
    branches: [main]
    paths:
      - resume.html
      - css/styles.css
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render resume.html to PDF
        run: |
          python3 -m http.server 8080 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/resume.html >/dev/null && break
            sleep 0.5
          done
          google-chrome --headless --disable-gpu --no-sandbox \
            --print-to-pdf=resume.pdf --no-pdf-header-footer \
            http://localhost:8080/resume.html
      - name: Commit if the resume actually changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore: rebuild resume pdf"
          git push
